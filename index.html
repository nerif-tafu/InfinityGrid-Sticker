<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityGrid Sticker Designer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/AppIcon.png">
    <link rel="apple-touch-icon" href="/AppIcon.png">
    <link rel="stylesheet" href="assets/css/app.css">

</head>

<body>
    <main class="dashboard" id="dashboard">
        <!-- Tags will be rendered here -->
    </main>
    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editorModal" onclick="if (event.target === this) closeEditor()">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Tag</h3>
                <button class="modal-close" onclick="closeEditor()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-section editor-setup">
                    <div class="setup-grid">
                        <div class="setup-cell" id="sizeSelector"></div>
                        <div class="setup-cell" id="labelShapeSelector"></div>
                        <div class="setup-cell" id="leftLayoutSelector"></div>
                        <div class="setup-cell" id="rightLayoutSelector"></div>
                    </div>
                </div>

                <!-- Interactive Preview -->
                <div class="editor-section">
                    <h4>Preview <span class="preview-hint">(click a slot to edit)</span></h4>
                    <div class="canvas-container">
                        <div class="canvas-wrapper" id="canvasWrapper">
                            <div class="canvas" id="canvas"></div>
                        </div>
                    </div>
                </div>
                <div class="editor-section">
                    <h4>Zone Editor</h4>
                    <div id="zoneInlineEditor" class="zone-inline-editor"></div>
                </div>

            </div>
            <div class="modal-footer">
                <div class="auto-name">
                    Tag name: <strong id="autoTagName">-</strong>
                </div>
                <div class="modal-actions modal-export-row">
                    <div class="form-group modal-export-field">
                        <label for="exportFormatSelect">Download Format</label>
                        <select id="exportFormatSelect" class="form-select">
                            <option value="3mf" selected>3MF (Multi-Color)</option>
                            <option value="step">STEP (Multi-Body)</option>
                            <option value="svg">SVG Profile</option>
                        </select>
                    </div>
                    <div class="form-group modal-export-field">
                        <label for="exportStyleSelect">Text Style</label>
                        <select id="exportStyleSelect" class="form-select">
                            <option value="flush" selected>Flush Text</option>
                            <option value="raised">Raised Text</option>
                        </select>
                    </div>
                    <button id="downloadExportBtn" class="btn btn-secondary" onclick="downloadCurrentExport()"
                        title="Download selected format" aria-label="Download selected format">Download</button>
                </div>
                <div id="singleExportStatus" class="export-status" aria-live="polite"></div>
                <div class="modal-actions modal-primary-actions">
                    <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveTag()">Save</button>
                    <button class="btn btn-primary btn-add-another" onclick="saveAndDuplicate()"
                        title="Save and duplicate current tag into a new draft">Save + Duplicate</button>
                    <button class="btn btn-primary btn-add-another" onclick="saveAndNew()"
                        title="Save and create new tag">Save + New</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Slot Editor Popup -->
    <div class="modal-overlay slot-editor-overlay" id="slotEditorModal"
        onclick="if (event.target === this) cancelZoneEdit()">
        <div class="modal slot-editor-modal" onclick="event.stopPropagation()">
            <div id="slotEditorPanel" class="zone-editor-panel"></div>
        </div>
    </div>

    <!-- JSON Export Popup -->
    <div class="modal-overlay" id="jsonExportModal" onclick="if (event.target === this) closeJSONExportModal()">
        <div class="modal json-export-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Export Tags JSON</h3>
                <button class="modal-close" onclick="closeJSONExportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="preview-hint" style="margin-bottom:0.5rem;">Use Share, Copy, or Download to save your
                    backup.</div>
                <div class="json-export-actions">
                    <button class="btn btn-secondary" onclick="downloadExportedJSON()">Download</button>
                    <button class="btn btn-secondary" id="jsonShareBtn" onclick="shareExportedJSON()">Share</button>
                    <button class="btn btn-primary" onclick="copyExportedJSON()">Copy</button>
                </div>
                <textarea id="jsonExportText" class="zone-input json-export-text" readonly></textarea>
                <div class="preview-hint" style="margin-top:0.5rem;">Filename: <span id="jsonExportFilename"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- JSON Import Popup -->
    <div class="modal-overlay" id="jsonImportModal" onclick="if (event.target === this) closeJSONImportModal()">
        <div class="modal json-import-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Import Tags JSON</h3>
                <button class="modal-close" onclick="closeJSONImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="preview-hint" style="margin-bottom:0.5rem;">Upload a JSON file or paste JSON content.</div>
                <div class="json-import-actions">
                    <button class="btn btn-secondary" onclick="uploadImportJSONFile()">Upload JSON File</button>
                    <button class="btn btn-primary" onclick="importPastedJSON()">Import Pasted JSON</button>
                </div>
                <textarea id="jsonImportText" class="zone-input json-import-text"
                    placeholder="Paste JSON here..."></textarea>
            </div>
        </div>
    </div>

    <!-- 3D Preview Popup -->
    <div class="modal-overlay" id="preview3DModal" onclick="if (event.target === this) closePreview3DModal()">
        <div class="modal preview-3d-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>3D Label Preview</h3>
                <button class="modal-close" onclick="closePreview3DModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview3DViewport" class="preview-3d-viewport"></div>
                <div id="preview3DStatus" class="preview-hint" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="/assets/vendor/jszip.min.js"></script>
    <script src="/assets/vendor/three.min.js"></script>
    <script src="/assets/vendor/STLLoader.js"></script>
    <script src="/assets/vendor/OrbitControls.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
